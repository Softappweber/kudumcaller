<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SoloCall - Voice calls without phone numbers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6C63FF">
    <meta name="description" content="Free voice calls with just a URL. No phone number needed.">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <p>Connecting...</p>
    </div>

    <!-- Main Container -->
    <div id="app" class="hidden">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-icon">📞</span>
                <span class="logo-text">Solo<span class="highlight">Call</span></span>
            </div>
            <div class="header-status">
                <span id="connection-status" class="status-badge">● Connected</span>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Home Screen -->
            <div id="home-screen">
                <div class="hero">
                    <h1>Voice calls without<br><span class="gradient-text">phone numbers</span></h1>
                    <p class="subtitle">Share a link and talk instantly. No app installs needed.</p>
                </div>

                <div class="action-buttons">
                    <button id="create-call-btn" class="btn btn-primary btn-large">
                        <span class="btn-icon">📞</span>
                        Create a Call
                    </button>
                    <div class="divider">
                        <span>or</span>
                    </div>
                    <div class="join-section">
                        <input type="text" id="room-input" placeholder="Enter room code...">
                        <button id="join-call-btn" class="btn btn-secondary">Join</button>
                    </div>
                </div>

                <div class="features">
                    <div class="feature">
                        <span class="feature-icon">🔗</span>
                        <span>Share a link</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">🎤</span>
                        <span>Instant voice</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">🔒</span>
                        <span>Private & encrypted</span>
                    </div>
                </div>
            </div>

            <!-- Call Screen -->
            <div id="call-screen" class="hidden">
                <div class="call-container">
                    <!-- Room Info -->
                    <div class="call-info">
                        <div class="room-code">
                            <span class="label">Room:</span>
                            <span id="room-display" class="code">------</span>
                            <button id="copy-room-btn" class="btn-icon-only" title="Copy room link">
                                📋
                            </button>
                        </div>
                        <div class="participant-info">
                            <span id="participant-status">Waiting for someone to join...</span>
                        </div>
                    </div>

                    <!-- Call Status -->
                    <div class="call-status">
                        <div id="connection-indicator" class="status-indicator connecting">
                            <span class="pulse"></span>
                            <span id="status-text">Connecting...</span>
                        </div>
                    </div>

                    <!-- Call Controls -->
                    <div class="call-controls">
                        <button id="mute-btn" class="control-btn" title="Mute">
                            <span class="control-icon">🎤</span>
                            <span class="control-label">Mute</span>
                        </button>
                        <button id="end-call-btn" class="control-btn end-call" title="End call">
                            <span class="control-icon">📴</span>
                            <span class="control-label">End</span>
                        </button>
                        <button id="copy-link-btn" class="control-btn" title="Share link">
                            <span class="control-icon">🔗</span>
                            <span class="control-label">Share</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Toast Notifications -->
        <div id="toast-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
